<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Who gets the power?</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Who gets the power?</h1>
  <div class="head-r"><span class="tag">Synthetic data</span><button class="link" id="open-drawer" aria-controls="drawer" aria-expanded="false">Under the hood</button></div>
</header>
<nav class="pipe" id="pipe" aria-label="Stages"></nav>
<main>
  <section class="mapbox" aria-label="Map of Karachi">
    <svg id="map" viewBox="0 0 800 540" role="img" aria-label="Stylised map of Karachi: a power station feeding Lyari, Gulshan-e-Iqbal, Saddar, a hypothetical AI data centre and Civil Hospital, with the Arabian Sea at the bottom"></svg>
    <div class="clock" id="clock" aria-live="polite"></div>
    <div class="gauge" id="gauge"></div>
  </section>
  <section class="narr">
    <div class="story" id="story" aria-live="polite"></div>
    <div class="nav"><button class="btn" id="back">Back</button><span class="count" id="count"></span><button class="btn primary" id="next">Next</button></div>
  </section>
</main>
<footer>This story, its places and its numbers (including the loss percentages) are made up for the demo.</footer>
<aside id="drawer" class="drawer" aria-label="Under the hood" aria-hidden="true">
  <div class="dhead"><h2>Under the hood</h2><button class="link" id="close-drawer">Close (Esc)</button></div>
  <div id="dbody"></div>
</aside>
<script src="app.js"></script>
</body>
</html>
